<style>
  /* iframe 用 fixed 铺满整个屏幕（连状态栏和底部横条下面也铺）。
     安全区交给里面的 app 自己让：顶上那条深木色也是 app 自己画的，
     时间电量是白字，垫在深色上才看得清。 */
  html, body { margin: 0; height: 100%; background: #DCD8CC; overflow: hidden; }
  /* iOS 26 的已知毛病：主屏幕 app 里 100%（还有 100dvh）会比真屏幕短一个状态栏高，
     整页连同里面的 app 被从这里截断，底下露出一条。只有 100lvh 量得对。
     所以装到主屏幕时，html/body 用 100lvh；Safari 标签页里不受影响。 */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    html, body { height: 100lvh; }
  }
  html.ios-app, html.ios-app body { height: 100lvh; }
  #app {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; border: 0; display: block; background: #DCD8CC;
  }
  /* iPhone 读动作传感器要用户在最外层点一下授权。app 在小框里点的不算，
     所以由外壳自己冒一条小木牌，压在 app 上面。 */

    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); z-index: 10;
    transform: translateX(-50%); display: none; align-items: center; gap: 8px;
    width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 8px 8px 8px 14px;
    font: 700 14px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; color: #3A2A1E;
    background: #F2E2C4; border: 3px solid #3A2A1E; box-shadow: 0 3px 0 #3A2A1E;
  }
  #tiltAsk.on { display: flex; }
  #tiltAsk span { flex: 1; min-width: 0; }
  #tiltAsk button {
    flex: none; padding: 7px 12px; font: inherit; color: #FFF6E4; background: #4E7A3E;
    border: 3px solid #3A2A1E; border-radius: 0; box-shadow: 0 3px 0 #3A2A1E;
  }
  #tiltAsk button.no { color: #3A2A1E; background: #FFF6E4; }
  #tiltAsk button:active { transform: translateY(3px); box-shadow: none; }

  #bootSnake {
    position: fixed; inset: 0; z-index: 20; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: #D7D1C4; transition: opacity .3s steps(3);

  #bootSnake.bye { opacity: 0; pointer-events: none; }
  #bootSnake canvas { display: block; flex: none; width: 384px; height: 864px; image-rendering: pixelated; image-rendering: crisp-edges; }
  #bootSnake p {

    font: 15px 'ZpixBoot', -apple-system, 'PingFang SC', sans-serif; letter-spacing: .14em; color: #6B5442;

<body>
<div id="bootSnake" role="status" aria-live="polite">
  <canvas id="bootCv" width="96" height="216" aria-hidden="true"></canvas>
  <p id="bootTxt">正在载入…</p>
</div>
<script>
var PIX_PAL = {
  '.': null,
  k: '#3A2A1E', w: '#FFF6E4', y: '#E0913C', r: '#A85632', R: '#C4342A',
  g: '#4E7A3E', G: '#7FA85A', b: '#3F6E8C', B: '#8FB6C4',
  t: '#8A5A34', T: '#C89A5E', p: '#E2C4C6', m: '#B0546A'
};
var PIX_SPRITES = {
  egg: ['..kkkk..', '.kwwwwk.', 'kwwyywwk', 'kwyyyywk',
        'kwwyywwk', 'kwwwwwwk', '.kwwwwk.', '..kkkk..'],
  meat: ['...kk...', '..kmmk..', '.kmmmmk.', 'kmmrrmmk',
         'kmrrrrmk', 'kmmrrmmk', '.kmmmmk.', '..kkkk..'],
  fish: ['........', '...kkk.k', '..kBBBkk', '.kBkBBBk',
         '.kBBBBkk', '..kBBk.k', '...kk...', '........'],
  leaf: ['.....kk.', '....kGk.', '...kGGk.', '..kGgGk.',
         '.kGggGk.', '.kgggk..', '..kgk...', '..k.....'],
  chili: ['.....kk.', '....kgk.', '...kRgk.', '..kRRk..',
          '.kRRRk..', '.kRRk...', '..kk....', '........'],
  rice: ['........', '..kwwk..', '.kwwwwk.', 'kkkkkkkk',
         'kTTTTTTk', '.kTTTTk.', '..kttk..', '...kk...'],
  noodle: ['........', '.kyykyk.', 'kykyykyk', 'kkkkkkkk',
           'kTTTTTTk', '.kTTTTk.', '..kttk..', '...kk...'],
  soup: ['........', '........', '.k....k.', 'kkkkkkkk',
         'kBBBBBBk', 'kTBBBBTk', '.kTTTTk.', '..kkkk..'],
  tofu: ['........', '.kkkkkk.', 'kwwwwwwk', 'kwwwwwwk',
         'kwwwwwwk', 'kwwwwwwk', '.kkkkkk.', '........'],
  cake: ['...k....', '..kRk...', '.kkkkkk.', 'kppppppk',
         'kwwwwwwk', 'kppppppk', 'kkkkkkkk', '........'],
  fruit: ['...kGk..', '..kGGk..', '.kRRRRk.', 'kRRRRRRk',
          'kRRRRRRk', 'kRRRRRRk', '.kRRRRk.', '..kkkk..'],
  dumpling: ['........', '..kkkk..', '.kwwwwk.', 'kwTwTwwk',
             'kwwwwwwk', 'kTwwwwTk', '.kkkkkk.', '........']
};
/* 加载画面：整个屏幕铺满棋盘格，中间一排食材，一条蛇从右往左把它们一个个吃掉，越吃越胖、越爬越快。
   画法跟贪吃蛇彩蛋一样：8×8 一格，蛇身是格子中间的方块，胖一档方块就大一圈。
   一趟爬完（尾巴也出了左边）就重新摆一排再来。加载完了不会半路掐断：
   finish() 让蛇加速把这一趟吃完、爬出屏幕，再收起。
   夜里棋盘是深蓝的，中间那排像被月光照亮，越往上下越暗。 */
function pixSnakeRun(cv, opts) {
  opts = opts || {};
  var C = 8, S = 4;                    // 一格 8 像素，放大 4 倍
  var g = null;
  try { g = cv.getContext('2d'); } catch (e) {}
  var keys = [];
  for (var k in PIX_SPRITES) if (Object.prototype.hasOwnProperty.call(PIX_SPRITES, k)) keys.push(k);
  var cols = 12, rows = 9, mid = 4, body = [], foods = [], total = 1, eaten = 0;
  var timer = 0, dead = false, fast = 0, onDone = null;

  function lay() {
    var box = cv.parentNode || {};
    var w = box.clientWidth || window.innerWidth || 390;
    var h = box.clientHeight || window.innerHeight || 844;
    cols = Math.max(8, Math.ceil(w / (C * S)));
    rows = Math.max(3, Math.ceil(h / (C * S)));
    if (rows % 2 === 0) rows++;                      // 单数行，食材那排正好在正中间
    mid = (rows - 1) / 2;
    if (cv.width !== cols * C) cv.width = cols * C;
    if (cv.height !== rows * C) cv.height = rows * C;
    cv.style.width = (cols * C * S) + 'px';
    cv.style.height = (rows * C * S) + 'px';
    if (opts.label) {                                // 字放在食材那排下面隔一行
      var top = (h - rows * C * S) / 2 + (mid + 2) * C * S;
      opts.label.style.top = Math.round(top) + 'px';
    }
    foods = [];
    var last = '';
    for (var x = 1; x < cols - 1; x += 2) {          // 隔一格放一样，排成一横排
      var pick = keys[Math.floor(Math.random() * keys.length)];
      if (pick === last && keys.length > 1) pick = keys[(keys.indexOf(pick) + 1) % keys.length];
      last = pick;
      foods.push({ x: x, k: pick });
    }
    total = Math.max(1, foods.length);
    eaten = 0;
    body = [cols, cols + 1, cols + 2];                // 头在前，先藏在右边屏幕外
  }

  function fat() { return 4 + Math.round(4 * eaten / total); }           // 4 → 8，吃完正好最胖
  function tick() { return fast || [150, 135, 122, 110, 98][fat() - 4]; }

  function sprite(key, px, py) {
    var rws = PIX_SPRITES[key];
    for (var y = 0; y < 8; y++) {
      for (var x = 0; x < 8; x++) {
        var c = PIX_PAL[rws[y].charAt(x)];
        if (!c) continue;
        g.fillStyle = c;
        g.fillRect(px + x, py + y, 1, 1);
      }
    }
  }

  function night() { return !!(opts.isNight && opts.isNight()); }

  function draw() {
    if (!g) return;
    var n = night();
    g.fillStyle = n ? '#232A40' : '#D7D1C4';
    g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = n ? 'rgba(170,190,255,.07)' : 'rgba(58,42,30,.055)';
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) if ((x + y) % 2) g.fillRect(x * C, y * C, C, C);
    }
    if (n) {
      // 月光照着中间那排：一行一行往外淡，像素一档一档的，不是平滑渐变
      for (var r = 0; r < rows; r++) {
        var d = Math.abs(r - mid);
        var a = [0.17, 0.13, 0.09, 0.06, 0.03][d] || 0;
        if (!a) continue;
        g.fillStyle = 'rgba(150,178,255,' + a + ')';
        g.fillRect(0, r * C, cv.width, C);
      }
    }
    var fy = mid * C;
    for (var i = 0; i < foods.length; i++) sprite(foods[i].k, foods[i].x * C, fy);
    var w = fat(), off = Math.floor((C - w) / 2);
    for (var j = body.length - 1; j >= 0; j--) {
      var bx = body[j];
      if (bx < -1 || bx > cols) continue;
      g.fillStyle = j === 0 ? (n ? '#4E7A3E' : '#365428') : (n ? '#6E9A52' : '#4E7A3E');
      g.fillRect(bx * C + off, fy + off, w, w);
    }
    // 眼睛朝左（往前看）
    var hx = body[0] * C + off;
    g.fillStyle = '#FFF6E4';
    g.fillRect(hx + 1, fy + off + 1, 1, 1);
    g.fillRect(hx + 1, fy + off + w - 2, 1, 1);
  }

  function step() {
    if (dead) return;
    var nx = body[0] - 1;
    body.unshift(nx);
    var hit = -1;
    for (var i = 0; i < foods.length; i++) if (foods[i].x === nx) hit = i;
    if (hit > -1) { foods.splice(hit, 1); eaten++; }   // 吃到一样：长一节、胖一点
    else body.pop();
    if (body[body.length - 1] < 0) {                   // 尾巴也出了左边：这一趟完整爬完了
      if (onDone) { dead = true; draw(); var f = onDone; onDone = null; f(); return; }
      lay();
    }
    draw();
    timer = setTimeout(step, tick());
  }

  lay();
  draw();
  timer = setTimeout(step, tick());
  return {
    stop: function () { dead = true; clearTimeout(timer); },
    relay: function () { if (!onDone) { lay(); draw(); } else draw(); },
    redraw: draw,
    /* 加载完了：加速把这一趟吃完、爬出左边，再调 cb。剩下的路大约 0.7 秒走完。 */
    finish: function (cb) {
      if (dead) { cb(); return; }
      onDone = cb;
      var left = body[0] + body.length + foods.length + 1;
      fast = Math.max(16, Math.min(60, Math.round(700 / Math.max(1, left))));
      clearTimeout(timer);
      timer = setTimeout(step, fast);
    },
    state: function () {
      return { cols: cols, rows: rows, mid: mid, body: body.slice(), foods: foods.length, eaten: eaten, fat: fat(), fast: fast };
    }
  };
}
(function () {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('gd_prefs') || '{}') || {}; } catch (e) {}
  var th = p.themePref || 'auto', h = new Date().getHours();
  if (th === 'night' || (th === 'auto' && (h >= 20 || h < 6))) document.documentElement.className += ' night';
  if (p.gd_lang === 'en') document.getElementById('bootTxt').textContent = 'Loading…';
  var root = document.documentElement;
  var run = pixSnakeRun(document.getElementById('bootCv'), {
    label: document.getElementById('bootTxt'),
    isNight: function () { return (' ' + root.className + ' ').indexOf(' night ') > -1; }
  });
  var box = document.getElementById('bootSnake'), rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (box.parentNode) run.relay(); }, 150);
  });
  var ending = false;
  // app 说加载完了：不半路掐断，蛇加速把这一趟吃完、爬出左边再收
  window.bootDone = function () {
    if (ending) return;
    ending = true;
    run.finish(function () {
      box.className += ' bye';
      setTimeout(function () { run.stop(); if (box.parentNode) box.parentNode.removeChild(box); }, 320);
    });
  };
  setTimeout(window.bootDone, 45000);   // 兜底：老版本的 app 不会发 loaded
})();
</script>
<iframe id="app" title="上厨房"
        allow="geolocation; microphone; clipboard-read; clipboard-write; fullscreen; accelerometer; gyroscope; magnetometer; screen-wake-lock"></iframe>
<div id="tiltAsk" role="dialog"><span id="tiltAskText"></span>
  <button type="button" id="tiltYes"></button><button type="button" class="no" id="tiltNo"></button></div>
<script>
  /* ↓↓↓ 把引号里换成你的 Apps Script「网页应用」网址（/exec 结尾） ↓↓↓ */
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyXwr4fKTNNmwnmsCdT8udhannVAk5vEKfaQp5x55VawQLNQqLJzAWKytchlDZhJGcBVg/exec';
  /* ↑↑↑ 只改这一行 ↑↑↑ */

  // 设置（语言、日夜、默认页、我是谁、冰箱提醒天数）存在外壳这里。
  // app 本身跑在 Google 的小框里，iPhone 会把小框的本地存储当临时的，一关就丢；
  // 外壳是最外层，存储会一直留着。app 启动时来要一份，改了就交过来存。
  var PREF_STORE = 'gd_prefs';
  function loadPrefs() {
    try { return JSON.parse(localStorage.getItem(PREF_STORE) || '{}') || {}; } catch (e) { return {}; }
  }
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/\.googleusercontent\.com$/.test(host) && host !== 'script.google.com') return;
    var d = e.data || {};
    if (d.gd === 'tilt-on') { tiltStart(e.source, e.origin, d.lang, d.reask); return; }
    if (d.gd === 'tilt-off') { tiltStop(); return; }
    if (d.gd === 'tilt-ping') { tiltHello(e.source, e.origin); return; }
    if (d.gd === 'buzz') { buzz(d.p); return; }
    if (d.gd === 'loaded') { if (window.bootDone) window.bootDone(); return; }
    if (d.gd === 'awake') { setAwake(d.on === true); return; }
    if (d.gd === 'home-set') {
      var k = cleanKey(d.key);
      try { if (k) localStorage.setItem(HOME_STORE, k); else localStorage.removeItem(HOME_STORE); } catch (err) {}
      return;
    }
    if (d.gd === 'pref-req') {
      e.source.postMessage({ gd: 'prefs', prefs: loadPrefs(), boot: 1 }, e.origin);
    } else if (d.gd === 'pref-set' && typeof d.key === 'string' && d.key.length < 64) {
      var p = loadPrefs();
      if (d.value == null) delete p[d.key]; else p[d.key] = String(d.value).slice(0, 200);
      try { localStorage.setItem(PREF_STORE, JSON.stringify(p)); } catch (err) {}
    }
  });


  /* ---------- 体感：社区页的泡泡跟着手机倾斜 ----------
     app 套在 Google 的几层小框里，iPhone、Android 都不太肯把方向传感器交给小框。
     外壳是最外层，量得到：app 进了社区页发 tilt-on，这里开始量，
     把 beta / gamma（前后、左右歪了多少度）和屏幕方向送进去；离开社区页发 tilt-off 就停。
     摇一摇另外发一条 shake。
     iPhone 要用户在这一层点一下才肯给，所以量不到时冒一条小木牌问一句；
     拒绝过就记下来不再问，app 设置里把这个功能关了再开会重新问。 */
  var TILT = { on: false, win: null, origin: '*', last: 0, got: false, shakeAt: 0, lang: 'zh', timer: 0 };
  var TILT_DENIED = 'gd_tilt_denied';
  var SHELL_VERSION = 6;   // app 的设置页会显示这个，用来确认手机上跑的是新外壳
  var tiltAsk = document.getElementById('tiltAsk');

  function needsPermission() {
    return typeof DeviceOrientationEvent !== 'undefined' &&
           typeof DeviceOrientationEvent.requestPermission === 'function';
  }
  function screenAngle() {
    var a = (screen.orientation && typeof screen.orientation.angle === 'number')
      ? screen.orientation.angle : (window.orientation || 0);
    return ((Number(a) || 0) % 360 + 360) % 360;
  }
  /* 告诉 app：外壳是新版的、是不是要授权的 iPhone、授权到哪一步了。
     state：granted（有读数了）· denied（拒绝过）· waiting（还没读数，也没拒绝过） */
  function tiltState() {
    if (TILT.got) return 'granted';
    try { if (localStorage.getItem(TILT_DENIED) === '1') return 'denied'; } catch (err) {}
    return 'waiting';
  }
  function tiltHello(win, origin) {
    try {
      // href：外壳自己的网址（不带 ?h=），app 用它拼邀请链接，对方打开也能装到主屏幕
      win.postMessage({ gd: 'tilt-hello', v: SHELL_VERSION, ios: needsPermission(), state: tiltState(),
                        href: location.origin + location.pathname }, origin);
    } catch (err) {}
  }
  function send(msg) {
    if (!TILT.on || !TILT.win) return;
    try { TILT.win.postMessage(msg, TILT.origin); } catch (err) {}
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    TILT.got = true;
    if (tiltAsk.classList.contains('on')) tiltAsk.classList.remove('on');
    var now = Date.now();
    if (now - TILT.last < 33) return;          // 一秒 30 次就够
    TILT.last = now;
    send({ gd: 'tilt', b: e.beta, g: e.gamma, a: screenAngle() });
  }
  function onMotion(e) {
    var g = e.accelerationIncludingGravity;
    if (!g || g.x == null) return;
    var m = Math.sqrt(g.x * g.x + g.y * g.y + g.z * g.z);
    var now = Date.now();
    if (Math.abs(m - 9.81) > 8 && now - TILT.shakeAt > 700) {
      TILT.shakeAt = now;
      send({ gd: 'shake' });
    }
  }
  function askText() {
    var en = TILT.lang === 'en';
    document.getElementById('tiltAskText').textContent = en
      ? 'Let the bubbles follow your phone’s tilt?' : '让泡泡跟着手机倾斜？';
    document.getElementById('tiltYes').textContent = en ? 'Allow' : '允许';
    document.getElementById('tiltNo').textContent = en ? 'Not now' : '不用';
  }
  function tiltStart(win, origin, lang, reask) {
    TILT.win = win; TILT.origin = origin; TILT.lang = lang === 'en' ? 'en' : 'zh';
    if (reask) { try { localStorage.removeItem(TILT_DENIED); } catch (err) {} }
    tiltHello(win, origin);
    if (TILT.on) return;
    TILT.on = true;
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    // 等一会儿还没读数，又是要授权的 iPhone，就问一句
    clearTimeout(TILT.timer);
    TILT.timer = setTimeout(function () {
      var denied = false;
      try { denied = localStorage.getItem(TILT_DENIED) === '1'; } catch (err) {}
      if (TILT.on && !TILT.got && needsPermission() && !denied) { askText(); tiltAsk.classList.add('on'); }
    }, 900);
  }
  function tiltStop() {
    TILT.on = false;
    clearTimeout(TILT.timer);
    window.removeEventListener('deviceorientation', onOrient);
    window.removeEventListener('devicemotion', onMotion);
    tiltAsk.classList.remove('on');
  }
  document.getElementById('tiltYes').onclick = function () {
    tiltAsk.classList.remove('on');
    // 两个都要在这一下点击里当场发出去，晚一拍 iPhone 就不认了
    var asks = [DeviceOrientationEvent.requestPermission()];
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      asks.push(DeviceMotionEvent.requestPermission());
    }
    Promise.all(asks).then(function (res) {
      if (res[0] !== 'granted') { try { localStorage.setItem(TILT_DENIED, '1'); } catch (err) {} }
      if (TILT.win) tiltHello(TILT.win, TILT.origin);
    }).catch(function () {});
  };
  document.getElementById('tiltNo').onclick = function () {
    tiltAsk.classList.remove('on');
    try { localStorage.setItem(TILT_DENIED, '1'); } catch (err) {}
    if (TILT.win) tiltHello(TILT.win, TILT.origin);
  };

  /* ---------- 震动、屏幕常亮 ----------
     app 在 Google 的小框里，震动和常亮都拿不到；外壳是最外层，替它做。
     倒计时到点 → buzz；开始做、倒计时在走 → awake on。切回前台时系统会收回常亮，要重新要。 */
  function buzz(p) {
    var pat = Array.isArray(p) ? p.slice(0, 10).map(function (n) { return Math.max(0, Math.min(2000, Number(n) || 0)); })
                               : [300];
    try { if (navigator.vibrate) navigator.vibrate(pat); } catch (err) {}
  }
  var wake = null, wantAwake = false;
  function setAwake(on) {
    wantAwake = on;
    if (on) {
      if (wake || !navigator.wakeLock) return;
      try {
        navigator.wakeLock.request('screen').then(function (l) {
          wake = l;
          l.addEventListener('release', function () { wake = null; });
          if (!wantAwake) { l.release(); wake = null; }
        }).catch(function () {});
      } catch (err) {}
    } else if (wake) {
      try { wake.release(); } catch (err) {}
      wake = null;
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wantAwake && !wake) setAwake(true);
  });

  /* ---------- 这户的钥匙（?h=） ----------
     邀请链接后面带着 ?h=钥匙。第一次打开就记在外壳这一层；之后不管从主屏幕图标打开时
     ?h= 还在不在（iPhone、Android 都可能丢掉），都用记住的那把。
     app 里换了钥匙（主账号「锁上 / 换钥匙」、或者在「打不开」那页贴了链接）会发 home-set 过来。
     iPhone 的主屏幕 app 和 Safari 各存各的：在 Safari 里打开过不算，主屏幕 app 第一次
     没带钥匙时，app 会请对方把链接贴一次，贴完就记住了。 */
  var HOME_STORE = 'gd_home';
  function cleanKey(v) { v = String(v || ''); return /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : ''; }
  var params = new URLSearchParams(location.search);
  var homeKey = cleanKey(params.get('h'));
  try {
    if (homeKey) localStorage.setItem(HOME_STORE, homeKey);
    else homeKey = cleanKey(localStorage.getItem(HOME_STORE));
  } catch (err) {}
  if (homeKey) params.set('h', homeKey); else params.delete('h');

  // 外壳网址上带的其它参数（比如 ?theme=night）原样传进去
  // 贴网址时容易多贴一截（前缀贴了两遍、结尾多一个 /exec）：只认里面的部署 ID，重新拼成标准的 /exec 网址
  (function () {
    var ids = String(EXEC_URL).match(/AKfy[A-Za-z0-9_-]{20,}/g);
    if (ids) EXEC_URL = 'https://script.google.com/macros/s/' + ids[ids.length - 1] + '/exec';
  })();
  var app = document.getElementById('app');
  var qs = params.toString();
  app.src = EXEC_URL + (qs ? '?' + qs : '');

  // iPhone 主屏幕 app 的毛病：100% 高度会比真屏幕短一截（差不多一个状态栏高），
  // 底下就露出一条空白。所以平时按屏幕真实高度撑满。
  //
  // 键盘弹起时反过来：把 app 缩到键盘上面那块可见区域。
  // app 套在好几层 iframe 里，自己量不到键盘；外壳是最外层，量得到。
  // 外壳一缩，里面的 app 就以为屏幕变矮了，输入框、面板自然都待在键盘上面。
  if (navigator.standalone) document.documentElement.classList.add('ios-app');
  var vv = window.visualViewport;
  var kbOpen = false;

  function screenH() {
    var a = screen.width, b = screen.height;
    var portrait = window.innerHeight >= window.innerWidth;
    return Math.max(portrait ? Math.max(a, b) : Math.min(a, b), window.innerHeight);
  }

  function fit() {
    var visible = vv ? vv.height : window.innerHeight;
    kbOpen = !!vv && visible < window.innerHeight - 120;
    if (kbOpen) {
      app.style.top = Math.round(vv.offsetTop) + 'px';
      app.style.height = Math.round(visible) + 'px';
    } else {
      app.style.top = '0px';
      app.style.height = navigator.standalone ? screenH() + 'px' : '';
    }
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  window.addEventListener('pageshow', fit);
  document.addEventListener('visibilitychange', fit);

  // 外壳本身不该被滚动；被手势带着挪了就归位。键盘开着时由 fit 跟着可见区走，不去拽它。
  function pin() {
    if (kbOpen) { fit(); return; }
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  }
  window.addEventListener('scroll', pin);
  if (vv) {
    vv.addEventListener('scroll', pin);
    vv.addEventListener('resize', fit);
  }
</script>
</body>
</html>
