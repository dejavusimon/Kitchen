<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>上厨房</title>
<!-- 外壳页：只负责主屏幕图标、名字和全屏，里面整页嵌着 Apps Script 的 /exec。
     以后改 app 只在 Apps Script 里发新版本，这个页面不用动（/exec 网址不变）。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上厨房">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A1E16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* iframe 用 fixed 铺满整个屏幕（连状态栏和底部横条下面也铺）。
     安全区交给里面的 app 自己让：顶上那条深木色也是 app 自己画的，
     时间电量是白字，垫在深色上才看得清。 */
  html, body { margin: 0; height: 100%; background: #DCD8CC; overflow: hidden; }
  #app {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; height: 100%; border: 0; display: block; background: #DCD8CC;
  }
</style>
</head>
<body>
<iframe id="app" title="上厨房"
        allow="geolocation; clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  /* ↓↓↓ 把引号里换成你的 Apps Script「网页应用」网址（/exec 结尾） ↓↓↓ */
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyXwr4fKTNNmwnmsCdT8udhannVAk5vEKfaQp5x55VawQLNQqLJzAWKytchlDZhJGcBVg/exec';
  /* ↑↑↑ 只改这一行 ↑↑↑ */

  // 外壳网址上带的参数（比如 ?theme=night）原样传进去
  document.getElementById('app').src = EXEC_URL + location.search;
</script>
</body>
</html>
