<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>上厨房</title>
<!-- 外壳页：只负责主屏幕图标、名字和全屏，里面整页嵌着 Apps Script 的 /exec。
     以后改 app 只在 Apps Script 里发新版本，这个页面不用动（/exec 网址不变）。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上厨房">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A1E16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* iframe 用 fixed 铺满整个屏幕（连状态栏和底部横条下面也铺）。
     安全区交给里面的 app 自己让：顶上那条深木色也是 app 自己画的，
     时间电量是白字，垫在深色上才看得清。 */
  html, body { margin: 0; height: 100%; background: #FF00FF; overflow: hidden; }  /* 诊断用：品红 = 外壳 */
  /* iOS 26 的已知毛病：主屏幕 app 里 100%（还有 100dvh）会比真屏幕短一个状态栏高，
     整页连同里面的 app 被从这里截断，底下露出一条。只有 100lvh 量得对。
     所以装到主屏幕时，html/body 用 100lvh；Safari 标签页里不受影响。 */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    html, body { height: 100lvh; }
  }
  html.ios-app, html.ios-app body { height: 100lvh; }
  #app {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; border: 0; display: block; background: #00E5FF;  /* 诊断用：青色 = iframe */
  }
</style>
</head>
<body>
<iframe id="app" title="上厨房"
        allow="geolocation; clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  /* ↓↓↓ 把引号里换成你的 Apps Script「网页应用」网址（/exec 结尾） ↓↓↓ */
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyXwr4fKTNNmwnmsCdT8udhannVAk5vEKfaQp5x55VawQLNQqLJzAWKytchlDZhJGcBVg/exec';
  /* ↑↑↑ 只改这一行 ↑↑↑ */

  // 外壳网址上带的参数（比如 ?theme=night）原样传进去
  var app = document.getElementById('app');
  app.src = EXEC_URL + location.search;

  // iPhone 主屏幕 app 的毛病：100% 高度会比真屏幕短一截（差不多一个状态栏高），
  // 底下就露出一条空白。这里直接按屏幕真实高度撑满。
  if (navigator.standalone) document.documentElement.classList.add('ios-app');
  function fit() {
    if (!navigator.standalone) { app.style.height = ''; return; }
    var a = screen.width, b = screen.height;
    var portrait = window.innerHeight >= window.innerWidth;
    var h = portrait ? Math.max(a, b) : Math.min(a, b);
    app.style.height = Math.max(h, window.innerHeight) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  window.addEventListener('pageshow', fit);
  document.addEventListener('visibilitychange', fit);

  // 外壳本身永远不该被滚动；万一被手势带着挪了，立刻归位。
  function pin() {
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  }
  window.addEventListener('scroll', pin);
  if (window.visualViewport) {
    visualViewport.addEventListener('scroll', pin);
    visualViewport.addEventListener('resize', fit);
  }

  /* ===== 临时诊断：量出每一层到底多高，确认后删掉 ===== */
  (function () {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:9;' +
      'background:rgba(0,0,0,.8);color:#fff;font:12px/1.4 ui-monospace,Menlo,monospace;' +
      'padding:8px 10px;white-space:pre;pointer-events:none;border:2px solid #fff';
    document.body.appendChild(box);
    function probe(css) {
      var d = document.createElement('div');
      d.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;' + css;
      document.body.appendChild(d);
      var h = d.offsetHeight; d.remove(); return h;
    }
    function row() {
      var r = app.getBoundingClientRect(), vv = window.visualViewport;
      var dm = ['standalone', 'fullscreen', 'minimal-ui', 'browser'].filter(function (m) {
        return matchMedia('(display-mode: ' + m + ')').matches; })[0] || '?';
      box.textContent =
        'DIAG wrapper-dbg1\n' +
        'standalone ' + navigator.standalone + '  mode ' + dm + '\n' +
        'screen     ' + screen.width + ' x ' + screen.height + '\n' +
        'innerH     ' + window.innerHeight + '   docH ' + document.documentElement.clientHeight + '\n' +
        'vv         ' + (vv ? Math.round(vv.height) + ' @' + Math.round(vv.offsetTop) : '-') + '\n' +
        'vh/lvh     ' + probe('height:100vh') + ' / ' + probe('height:100lvh') + '\n' +
        'dvh/svh    ' + probe('height:100dvh') + ' / ' + probe('height:100svh') + '\n' +
        'safe t/b   ' + probe('height:env(safe-area-inset-top)') + ' / ' + probe('height:env(safe-area-inset-bottom)') + '\n' +
        'html/body  ' + document.documentElement.offsetHeight + ' / ' + document.body.offsetHeight + '\n' +
        'iframe     ' + Math.round(r.top) + ' → ' + Math.round(r.bottom) + ' (h ' + Math.round(r.height) + ')\n' +
        'scrollY    ' + window.scrollY;
    }
    row(); setInterval(row, 1000);
  })();
</script>
</body>
</html>
